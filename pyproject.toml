[project]
name = "arcam"
version = "1.0.0"
description = "Python 移植：让她走出屏幕 —— 透视投影立绘合成管线（投影/摆位/合成/抠图/视频）"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
matting = ["onnxruntime>=1.20"]
lidar = ["pillow-heif>=1.7", "OpenEXR>=3.3", "Imath>=0.2"]
video = ["imageio>=2.35", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8.0"]

[project.scripts]
arcam = "arcam.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
